name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - run: bun install --frozen-lockfile
      - run: bun run verify:repository
      - run: bun run test:repository
      - run: bun run test
      - run: bun run test:satellite
      - run: bun run test:tooling
      - run: bun run typecheck
      - run: bun run verify:fixtures
      - run: bun run build
      - run: bun run verify:static-security
      - run: bun run verify:offline
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: apps/web/.output/public
          retention-days: 7

  browser:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: apps/web/.output/public
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.browser }}
          path: test-results
          retention-days: 7
